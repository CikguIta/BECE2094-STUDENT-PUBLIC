&lt;p&gt;TOPIC 1: Foundation of Special Needs in Early Childhood Education&lt;/p&gt;
&lt;h3&gt;Learning Outcomes&lt;/h3&gt;
&lt;p&gt;学习成果&lt;/p&gt;
&lt;p&gt;Xuéxí chéngguǒ&lt;/p&gt;
&lt;p&gt;By the end of this topic, students should be able to:&lt;/p&gt;
&lt;p&gt;完成本课题后，学生应该能够：&lt;/p&gt;
&lt;p&gt;Wánchéng běn kètí hòu, xuéshēng yīnggāi nénggòu:&lt;/p&gt;
&lt;p&gt;1. Explain the meaning and purpose of special education.&lt;/p&gt;
&lt;p&gt;解释特殊教育的含义和目的。&lt;/p&gt;
&lt;p&gt;Jiěshì tèshū jiàoyù de hányì hé mùdì.&lt;/p&gt;
&lt;p&gt;2. Describe different perceptions of disability.&lt;/p&gt;
&lt;p&gt;描述人们对残障的不同看法。&lt;/p&gt;
&lt;p&gt;Miáoshù rénmen duì cánzhàng de bùtóng kànfǎ.&lt;/p&gt;
&lt;p&gt;3. Identify the common needs and characteristics of children with special educational needs.&lt;/p&gt;
&lt;p&gt;识别有特殊教育需要儿童的常见需求和特征。&lt;/p&gt;
&lt;p&gt;Shíbié yǒu tèshū jiàoyù xūyào értóng de chángjiàn xūqiú hé tèzhēng.&lt;/p&gt;
&lt;h2&gt;1.1 What Is Special Education?&lt;/h2&gt;
&lt;p&gt;什么是特殊教育？&lt;/p&gt;
&lt;p&gt;Shénme shì tèshū jiàoyù?&lt;/p&gt;
&lt;h3&gt;1.1.1 Definition of Special Education&lt;/h3&gt;
&lt;p&gt;特殊教育的定义&lt;/p&gt;
&lt;p&gt;Tèshū jiàoyù de dìngyì&lt;/p&gt;
&lt;p&gt;Special education is education designed to support children who have special learning needs.&lt;/p&gt;
&lt;p&gt;特殊教育是为有特殊学习需要的儿童提供支持的教育。&lt;/p&gt;
&lt;p&gt;Tèshū jiàoyù shì wèi yǒu tèshū xuéxí xūyào de értóng tígōng zhīchí de jiàoyù.&lt;/p&gt;
&lt;p&gt;Some children need different teaching methods, materials, or extra help to learn.&lt;/p&gt;
&lt;p&gt;有些儿童需要不同的教学方法、教材或额外的帮助来学习。&lt;/p&gt;
&lt;p&gt;Yǒuxiē értóng xūyào bùtóng de jiàoxué fāngfǎ, jiàocái huò éwài de bāngzhù lái xuéxí.&lt;/p&gt;
&lt;p&gt;Special education helps these children learn, develop skills, and take part in school activities.&lt;/p&gt;
&lt;p&gt;特殊教育帮助这些儿童学习、发展技能和参与学校活动。&lt;/p&gt;
&lt;p&gt;Tèshū jiàoyù bāngzhù zhèxiē értóng xuéxí, fāzhǎn jìnéng hé cānyù xuéxiào huódòng.&lt;/p&gt;
&lt;p&gt;Example / 例子 / Lìzi&lt;/p&gt;
&lt;p&gt;A child with hearing loss may need visual instructions and a teacher who speaks clearly.&lt;/p&gt;
&lt;p&gt;有听力障碍的儿童可能需要视觉指示和说话清楚的教师。&lt;/p&gt;
&lt;p&gt;Yǒu tīnglì zhàng&amp;#x27;ài de értóng kěnéng xūyào shìjué zhǐshì hé shuōhuà qīngchǔ de jiàoshī.&lt;/p&gt;
&lt;div class=&quot;placeholder&quot; role=&quot;img&quot; aria-label=&quot;IMAGE PLACEHOLDER — Inclusive preschool teacher using picture cards with young children&quot;&gt;🖼 [IMAGE PLACEHOLDER — Inclusive preschool teacher using picture cards with young children]&lt;/div&gt;
&lt;h3&gt;1.1.2 Purpose of Special Education&lt;/h3&gt;
&lt;p&gt;特殊教育的目的&lt;/p&gt;
&lt;p&gt;Tèshū jiàoyù de mùdì&lt;/p&gt;
&lt;p&gt;1. Provide equal learning opportunities.&lt;/p&gt;
&lt;p&gt;提供平等的学习机会。&lt;/p&gt;
&lt;p&gt;Tígōng píngděng de xuéxí jīhuì.&lt;/p&gt;
&lt;p&gt;Every child should have the opportunity to learn.&lt;/p&gt;
&lt;p&gt;每个儿童都应该有学习的机会。&lt;/p&gt;
&lt;p&gt;Měi gè értóng dōu yīnggāi yǒu xuéxí de jīhuì.&lt;/p&gt;
&lt;p&gt;2. Support individual learning needs.&lt;/p&gt;
&lt;p&gt;支持个人的学习需要。&lt;/p&gt;
&lt;p&gt;Zhīchí gèrén de xuéxí xūyào.&lt;/p&gt;
&lt;p&gt;Children learn in different ways and at different speeds.&lt;/p&gt;
&lt;p&gt;儿童以不同的方式和速度学习。&lt;/p&gt;
&lt;p&gt;Értóng yǐ bùtóng de fāngshì hé sùdù xuéxí.&lt;/p&gt;
&lt;p&gt;3. Develop children&amp;#x27;s abilities.&lt;/p&gt;
&lt;p&gt;发展儿童的能力。&lt;/p&gt;
&lt;p&gt;Fāzhǎn értóng de nénglì.&lt;/p&gt;
&lt;p&gt;Special education helps children develop communication, social, physical, and thinking skills.&lt;/p&gt;
&lt;p&gt;特殊教育帮助儿童发展沟通、社交、身体和思考能力。&lt;/p&gt;
&lt;p&gt;Tèshū jiàoyù bāngzhù értóng fāzhǎn gōutōng, shèjiāo, shēntǐ hé sīkǎo nénglì.&lt;/p&gt;
&lt;p&gt;4. Build independence and confidence.&lt;/p&gt;
&lt;p&gt;培养独立能力和自信心。&lt;/p&gt;
&lt;p&gt;Péiyǎng dúlì nénglì hé zìxìnxīn.&lt;/p&gt;
&lt;p&gt;Children learn to do everyday activities with suitable support.&lt;/p&gt;
&lt;p&gt;儿童在适当的支持下学习完成日常活动。&lt;/p&gt;
&lt;p&gt;Értóng zài shìdàng de zhīchí xià xuéxí wánchéng rìcháng huódòng.&lt;/p&gt;
&lt;p&gt;5. Encourage participation and friendship.&lt;/p&gt;
&lt;p&gt;鼓励参与和建立友谊。&lt;/p&gt;
&lt;p&gt;Gǔlì cānyù hé jiànlì yǒuyì.&lt;/p&gt;
&lt;p&gt;Children with special needs should have opportunities to play and learn with other children.&lt;/p&gt;
&lt;p&gt;有特殊需要的儿童应该有机会与其他儿童一起玩耍和学习。&lt;/p&gt;
&lt;p&gt;Yǒu tèshū xūyào de értóng yīnggāi yǒu jīhuì yǔ qítā értóng yìqǐ wánshuǎ hé xuéxí.&lt;/p&gt;
&lt;h3&gt;1.1.3 Special Education and Inclusive Education&lt;/h3&gt;
&lt;p&gt;特殊教育与融合教育&lt;/p&gt;
&lt;p&gt;Tèshū jiàoyù yǔ rónghé jiàoyù&lt;/p&gt;
&lt;p&gt;Special Education / 特殊教育 / Tèshū jiàoyù&lt;/p&gt;
&lt;p&gt;Special education provides teaching and support according to a child&amp;#x27;s individual needs.&lt;/p&gt;
&lt;p&gt;特殊教育根据儿童的个人需要提供教学和支持。&lt;/p&gt;
&lt;p&gt;Tèshū jiàoyù gēnjù értóng de gèrén xūyào tígōng jiàoxué hé zhīchí.&lt;/p&gt;
&lt;p&gt;Inclusive Education / 融合教育 / Rónghé jiàoyù&lt;/p&gt;
&lt;p&gt;Inclusive education allows children with different abilities to learn and participate together.&lt;/p&gt;
&lt;p&gt;融合教育让不同能力的儿童一起学习和参与活动。&lt;/p&gt;
&lt;p&gt;Rónghé jiàoyù ràng bùtóng nénglì de értóng yìqǐ xuéxí hé cānyù huódòng.&lt;/p&gt;
&lt;p&gt;The teacher adapts activities so that every child can participate.&lt;/p&gt;
&lt;p&gt;教师调整活动，让每个儿童都能参与。&lt;/p&gt;
&lt;p&gt;Jiàoshī tiáozhěng huódòng, ràng měi gè értóng dōu néng cānyù.&lt;/p&gt;
&lt;div class=&quot;placeholder&quot; role=&quot;img&quot; aria-label=&quot;IMAGE PLACEHOLDER — Special Education: one-to-one picture-matching instruction&quot;&gt;🖼 [IMAGE PLACEHOLDER — Special Education: one-to-one picture-matching instruction]&lt;/div&gt;
&lt;div class=&quot;placeholder&quot; role=&quot;img&quot; aria-label=&quot;IMAGE PLACEHOLDER — Inclusive Education: children with different abilities playing together&quot;&gt;🖼 [IMAGE PLACEHOLDER — Inclusive Education: children with different abilities playing together]&lt;/div&gt;
&lt;p&gt;Example / 例子 / Lìzi&lt;/p&gt;
&lt;p&gt;During art time, a child who has difficulty holding a pencil may use a thicker crayon.&lt;/p&gt;
&lt;p&gt;在美术活动中，握笔有困难的儿童可以使用较粗的蜡笔。&lt;/p&gt;
&lt;p&gt;Zài měishù huódòng zhōng, wò bǐ yǒu kùnnán de értóng kěyǐ shǐyòng jiào cū de làbǐ.&lt;/p&gt;
&lt;p&gt;The child can join the same activity as other children.&lt;/p&gt;
&lt;p&gt;这个儿童可以和其他儿童一起参加相同的活动。&lt;/p&gt;
&lt;p&gt;Zhège értóng kěyǐ hé qítā értóng yìqǐ cānjiā xiāngtóng de huódòng.&lt;/p&gt;
&lt;h3&gt;1.1.4 Role of the Early Childhood Teacher&lt;/h3&gt;
&lt;p&gt;幼儿教师的角色&lt;/p&gt;
&lt;p&gt;Yòu&amp;#x27;ér jiàoshī de juésè&lt;/p&gt;
&lt;p&gt;Early childhood teachers play an important role in supporting children with special needs.&lt;/p&gt;
&lt;p&gt;幼儿教师在支持有特殊需要的儿童方面扮演重要角色。&lt;/p&gt;
&lt;p&gt;Yòu&amp;#x27;ér jiàoshī zài zhīchí yǒu tèshū xūyào de értóng fāngmiàn bànyǎn zhòngyào juésè.&lt;/p&gt;
&lt;p&gt;Teachers should:&lt;/p&gt;
&lt;p&gt;教师应该：&lt;/p&gt;
&lt;p&gt;Jiàoshī yīnggāi:&lt;/p&gt;
&lt;p&gt;Observe children&amp;#x27;s learning and behaviour.&lt;/p&gt;
&lt;p&gt;观察儿童的学习和行为。&lt;/p&gt;
&lt;p&gt;Guānchá értóng de xuéxí hé xíngwéi.&lt;/p&gt;
&lt;p&gt;Identify areas where children need support.&lt;/p&gt;
&lt;p&gt;识别儿童需要支持的方面。&lt;/p&gt;
&lt;p&gt;Shíbié értóng xūyào zhīchí de fāngmiàn.&lt;/p&gt;
&lt;p&gt;Adapt teaching methods and materials.&lt;/p&gt;
&lt;p&gt;调整教学方法和教材。&lt;/p&gt;
&lt;p&gt;Tiáozhěng jiàoxué fāngfǎ hé jiàocái.&lt;/p&gt;
&lt;p&gt;Work with parents and specialists.&lt;/p&gt;
&lt;p&gt;与家长和专业人员合作。&lt;/p&gt;
&lt;p&gt;Yǔ jiāzhǎng hé zhuānyè rényuán hézuò.&lt;/p&gt;
&lt;p&gt;Create a safe and welcoming classroom.&lt;/p&gt;
&lt;p&gt;创造安全和友善的教室环境。&lt;/p&gt;
&lt;p&gt;Chuàngzào ānquán hé yǒushàn de jiàoshì huánjìng.&lt;/p&gt;
&lt;p&gt;Important / 重要提醒 / Zhòngyào tíxǐng&lt;/p&gt;
&lt;p&gt;Teachers observe and support children. They should not diagnose disabilities.&lt;/p&gt;
&lt;p&gt;教师负责观察和支持儿童，不应该自行诊断残障。&lt;/p&gt;
&lt;p&gt;Jiàoshī fùzé guānchá hé zhīchí értóng, bù yīnggāi zìxíng zhěnduàn cánzhàng.&lt;/p&gt;
&lt;h3&gt;Hands-on Activity 1: One Activity, Different Needs&lt;/h3&gt;
&lt;p&gt;实践活动一：同一个活动，不同的需要&lt;/p&gt;
&lt;p&gt;Shíjiàn huódòng yī: Tóng yí gè huódòng, bùtóng de xūyào&lt;/p&gt;
&lt;p&gt;Situation / 情境 / Qíngjìng&lt;/p&gt;
&lt;p&gt;A preschool teacher wants all children to take part in a colouring activity.&lt;/p&gt;
&lt;p&gt;一位幼儿教师希望所有儿童都参加涂色活动。&lt;/p&gt;
&lt;p&gt;Yí wèi yòu&amp;#x27;ér jiàoshī xīwàng suǒyǒu értóng dōu cānjiā túsè huódòng.&lt;/p&gt;
&lt;p&gt;One child has difficulty holding a crayon.&lt;/p&gt;
&lt;p&gt;一个儿童握蜡笔有困难。&lt;/p&gt;
&lt;p&gt;Yí gè értóng wò làbǐ yǒu kùnnán.&lt;/p&gt;
&lt;p&gt;Another child has difficulty seeing small pictures.&lt;/p&gt;
&lt;p&gt;另一个儿童看小图片有困难。&lt;/p&gt;
&lt;p&gt;Lìng yí gè értóng kàn xiǎo túpiàn yǒu kùnnán.&lt;/p&gt;
&lt;p&gt;Task / 任务 / Rènwu&lt;/p&gt;
&lt;p&gt;Suggest two ways to help these children participate.&lt;/p&gt;
&lt;p&gt;提出两种方法，帮助这些儿童参与活动。&lt;/p&gt;
&lt;p&gt;Tíchū liǎng zhǒng fāngfǎ, bāngzhù zhèxiē értóng cānyù huódòng.&lt;/p&gt;
&lt;p&gt;Possible answers include thicker crayons, larger pictures, and additional time.&lt;/p&gt;
&lt;p&gt;可能的答案包括较粗的蜡笔、较大的图片和额外的时间。&lt;/p&gt;
&lt;p&gt;Kěnéng de dá&amp;#x27;àn bāokuò jiào cū de làbǐ, jiào dà de túpiàn hé éwài de shíjiān.&lt;/p&gt;
&lt;h2&gt;1.2 Perception of Disability, Definition, Criteria and Characteristics of Children with Special Needs&lt;/h2&gt;
&lt;p&gt;对残障的看法、有特殊需要儿童的定义、识别标准与特征&lt;/p&gt;
&lt;p&gt;Duì cánzhàng de kànfǎ, yǒu tèshū xūyào értóng de dìngyì, shíbié biāozhǔn yǔ tèzhēng&lt;/p&gt;
&lt;h3&gt;1.2.1 What Is Disability?&lt;/h3&gt;
&lt;p&gt;什么是残障？&lt;/p&gt;
&lt;p&gt;Shénme shì cánzhàng?&lt;/p&gt;
&lt;p&gt;A disability is a long-term physical, sensory, intellectual, or mental impairment that may affect a person&amp;#x27;s daily activities and participation.&lt;/p&gt;
&lt;p&gt;残障是指长期的身体、感官、智力或精神方面的功能障碍，可能影响一个人的日常活动和参与。&lt;/p&gt;
&lt;p&gt;Cánzhàng shì zhǐ chángqī de shēntǐ, gǎnguān, zhìlì huò jīngshén fāngmiàn de gōngnéng zhàng&amp;#x27;ài, kěnéng yǐngxiǎng yí gè rén de rìcháng huódòng hé cānyù.&lt;/p&gt;
&lt;p&gt;The difficulties a person experiences also depend on barriers in the environment.&lt;/p&gt;
&lt;p&gt;一个人遇到的困难也取决于环境中的障碍。&lt;/p&gt;
&lt;p&gt;Yí gè rén yùdào de kùnnán yě qǔjué yú huánjìng zhōng de zhàng&amp;#x27;ài.&lt;/p&gt;
&lt;p&gt;For example, stairs may prevent a child using a wheelchair from entering a classroom.&lt;/p&gt;
&lt;p&gt;例如，楼梯可能阻碍使用轮椅的儿童进入教室。&lt;/p&gt;
&lt;p&gt;Lìrú, lóutī kěnéng zǔ&amp;#x27;ài shǐyòng lúnyǐ de értóng jìnrù jiàoshì.&lt;/p&gt;
&lt;p&gt;A ramp can remove this barrier.&lt;/p&gt;
&lt;p&gt;斜坡道可以消除这个障碍。&lt;/p&gt;
&lt;p&gt;Xiépōdào kěyǐ xiāochú zhège zhàng&amp;#x27;ài.&lt;/p&gt;
&lt;div class=&quot;placeholder&quot; role=&quot;img&quot; aria-label=&quot;IMAGE PLACEHOLDER — Accessible preschool entrance with wheelchair ramp&quot;&gt;🖼 [IMAGE PLACEHOLDER — Accessible preschool entrance with wheelchair ramp]&lt;/div&gt;
&lt;h3&gt;1.2.2 Perceptions of Disability&lt;/h3&gt;
&lt;p&gt;对残障的不同看法&lt;/p&gt;
&lt;p&gt;Duì cánzhàng de bùtóng kànfǎ&lt;/p&gt;
&lt;p&gt;People have different beliefs and attitudes towards disability.&lt;/p&gt;
&lt;p&gt;人们对残障有不同的信念和态度。&lt;/p&gt;
&lt;p&gt;Rénmen duì cánzhàng yǒu bùtóng de xìnniàn hé tàidù.&lt;/p&gt;
&lt;p&gt;These attitudes can affect how children with disabilities are treated.&lt;/p&gt;
&lt;p&gt;这些态度会影响残障儿童受到的对待。&lt;/p&gt;
&lt;p&gt;Zhèxiē tàidù huì yǐngxiǎng cánzhàng értóng shòudào de duìdài.&lt;/p&gt;
&lt;p&gt;A. Negative Perception&lt;/p&gt;
&lt;p&gt;负面看法&lt;/p&gt;
&lt;p&gt;Fùmiàn kànfǎ&lt;/p&gt;
&lt;p&gt;Some people believe that children with disabilities cannot learn or take part in normal activities.&lt;/p&gt;
&lt;p&gt;有些人认为残障儿童无法学习或参加一般活动。&lt;/p&gt;
&lt;p&gt;Yǒuxiē rén rènwéi cánzhàng értóng wúfǎ xuéxí huò cānjiā yìbān huódòng.&lt;/p&gt;
&lt;p&gt;This belief is incorrect and can lead to discrimination.&lt;/p&gt;
&lt;p&gt;这种看法是不正确的，也可能导致歧视。&lt;/p&gt;
&lt;p&gt;Zhè zhǒng kànfǎ shì bù zhèngquè de, yě kěnéng dǎozhì qíshì.&lt;/p&gt;
&lt;p&gt;B. Medical Model of Disability&lt;/p&gt;
&lt;p&gt;残障的医学模式&lt;/p&gt;
&lt;p&gt;Cánzhàng de yīxué móshì&lt;/p&gt;
&lt;p&gt;The medical model focuses on a person&amp;#x27;s impairment and the treatment or support they may need.&lt;/p&gt;
&lt;p&gt;医学模式关注个人的功能障碍，以及他们可能需要的治疗或支持。&lt;/p&gt;
&lt;p&gt;Yīxué móshì guānzhù gèrén de gōngnéng zhàng&amp;#x27;ài, yǐjí tāmen kěnéng xūyào de zhìliáo huò zhīchí.&lt;/p&gt;
&lt;p&gt;Example / 例子 / Lìzi&lt;/p&gt;
&lt;p&gt;A child with hearing loss may benefit from hearing aids and support from an audiologist.&lt;/p&gt;
&lt;p&gt;有听力损失的儿童可能从助听器和听力专家的支持中受益。&lt;/p&gt;
&lt;p&gt;Yǒu tīnglì sǔnshī de értóng kěnéng cóng zhùtīngqì hé tīnglì zhuānjiā de zhīchí zhōng shòuyì.&lt;/p&gt;
&lt;p&gt;C. Social Model of Disability&lt;/p&gt;
&lt;p&gt;残障的社会模式&lt;/p&gt;
&lt;p&gt;Cánzhàng de shèhuì móshì&lt;/p&gt;
&lt;p&gt;The social model focuses on barriers in society and the environment.&lt;/p&gt;
&lt;p&gt;社会模式关注社会和环境中的障碍。&lt;/p&gt;
&lt;p&gt;Shèhuì móshì guānzhù shèhuì hé huánjìng zhōng de zhàng&amp;#x27;ài.&lt;/p&gt;
&lt;p&gt;It encourages people to remove barriers so everyone can participate.&lt;/p&gt;
&lt;p&gt;它鼓励人们消除障碍，让每个人都能参与。&lt;/p&gt;
&lt;p&gt;Tā gǔlì rénmen xiāochú zhàng&amp;#x27;ài, ràng měi gè rén dōu néng cānyù.&lt;/p&gt;
&lt;p&gt;Example / 例子 / Lìzi&lt;/p&gt;
&lt;p&gt;A teacher provides picture instructions for a child who finds spoken instructions difficult to understand.&lt;/p&gt;
&lt;p&gt;教师为难以理解口头指示的儿童提供图片指示。&lt;/p&gt;
&lt;p&gt;Jiàoshī wèi nányǐ lǐjiě kǒutóu zhǐshì de értóng tígōng túpiàn zhǐshì.&lt;/p&gt;
&lt;p&gt;D. Rights-Based View of Disability&lt;/p&gt;
&lt;p&gt;以权利为基础的残障观&lt;/p&gt;
&lt;p&gt;Yǐ quánlì wéi jīchǔ de cánzhàng guān&lt;/p&gt;
&lt;p&gt;Children with disabilities have the same human rights as other children.&lt;/p&gt;
&lt;p&gt;残障儿童与其他儿童享有相同的人权。&lt;/p&gt;
&lt;p&gt;Cánzhàng értóng yǔ qítā értóng xiǎngyǒu xiāngtóng de rénquán.&lt;/p&gt;
&lt;p&gt;They have the right to education, respect, safety, and participation.&lt;/p&gt;
&lt;p&gt;他们有权接受教育、受到尊重、获得安全保障和参与活动。&lt;/p&gt;
&lt;p&gt;Tāmen yǒu quán jiēshòu jiàoyù, shòudào zūnzhòng, huòdé ānquán bǎozhàng hé cānyù huódòng.&lt;/p&gt;
&lt;p&gt;Key message / 重点信息 / Zhòngdiǎn xìnxī&lt;/p&gt;
&lt;p&gt;We should focus on what children can do and how we can support them.&lt;/p&gt;
&lt;p&gt;我们应该关注儿童能够做什么，以及我们如何支持他们。&lt;/p&gt;
&lt;p&gt;Wǒmen yīnggāi guānzhù értóng nénggòu zuò shénme, yǐjí wǒmen rúhé zhīchí tāmen.&lt;/p&gt;
&lt;h3&gt;1.2.3 Who Are Children with Special Educational Needs?&lt;/h3&gt;
&lt;p&gt;谁是有特殊教育需要的儿童？&lt;/p&gt;
&lt;p&gt;Shéi shì yǒu tèshū jiàoyù xūyào de értóng?&lt;/p&gt;
&lt;p&gt;Children with special educational needs may require additional support to learn and participate in educational activities.&lt;/p&gt;
&lt;p&gt;有特殊教育需要的儿童可能需要额外的支持，才能学习和参与教育活动。&lt;/p&gt;
&lt;p&gt;Yǒu tèshū jiàoyù xūyào de értóng kěnéng xūyào éwài de zhīchí, cáinéng xuéxí hé cānyù jiàoyù huódòng.&lt;/p&gt;
&lt;p&gt;Their needs may be related to communication, learning, movement, senses, or behaviour.&lt;/p&gt;
&lt;p&gt;他们的需要可能与沟通、学习、动作、感官或行为有关。&lt;/p&gt;
&lt;p&gt;Tāmen de xūyào kěnéng yǔ gōutōng, xuéxí, dòngzuò, gǎnguān huò xíngwéi yǒuguān.&lt;/p&gt;
&lt;p&gt;Not all children with special educational needs have a diagnosed disability.&lt;/p&gt;
&lt;p&gt;并非所有有特殊教育需要的儿童都被诊断为有残障。&lt;/p&gt;
&lt;p&gt;Bìngfēi suǒyǒu yǒu tèshū jiàoyù xūyào de értóng dōu bèi zhěnduàn wéi yǒu cánzhàng.&lt;/p&gt;
&lt;h3&gt;1.2.4 Criteria for Identifying Special Educational Needs&lt;/h3&gt;
&lt;p&gt;识别特殊教育需要的标准&lt;/p&gt;
&lt;p&gt;Shíbié tèshū jiàoyù xūyào de biāozhǔn&lt;/p&gt;
&lt;p&gt;Teachers may notice that a child needs additional support in one or more areas.&lt;/p&gt;
&lt;p&gt;教师可能注意到儿童在一个或多个方面需要额外的支持。&lt;/p&gt;
&lt;p&gt;Jiàoshī kěnéng zhùyì dào értóng zài yí gè huò duō gè fāngmiàn xūyào éwài de zhīchí.&lt;/p&gt;
&lt;p&gt;The following are areas for observation, not diagnostic criteria.&lt;/p&gt;
&lt;p&gt;以下是观察的方面，而不是诊断标准。&lt;/p&gt;
&lt;p&gt;Yǐxià shì guānchá de fāngmiàn, ér bú shì zhěnduàn biāozhǔn.&lt;/p&gt;
&lt;p&gt;1. Communication / 沟通 / Gōutōng&lt;/p&gt;
&lt;p&gt;The child may have difficulty expressing needs or understanding instructions.&lt;/p&gt;
&lt;p&gt;儿童可能难以表达需要或理解指示。&lt;/p&gt;
&lt;p&gt;Értóng kěnéng nányǐ biǎodá xūyào huò lǐjiě zhǐshì.&lt;/p&gt;
&lt;p&gt;2. Learning / 学习 / Xuéxí&lt;/p&gt;
&lt;p&gt;The child may need more time, repetition, or different teaching methods.&lt;/p&gt;
&lt;p&gt;儿童可能需要更多时间、重复练习或不同的教学方法。&lt;/p&gt;
&lt;p&gt;Értóng kěnéng xūyào gèng duō shíjiān, chóngfù liànxí huò bùtóng de jiàoxué fāngfǎ.&lt;/p&gt;
&lt;p&gt;3. Movement / 动作 / Dòngzuò&lt;/p&gt;
&lt;p&gt;The child may have difficulty walking, balancing, or using small objects.&lt;/p&gt;
&lt;p&gt;儿童可能在走路、保持平衡或使用小物品方面有困难。&lt;/p&gt;
&lt;p&gt;Értóng kěnéng zài zǒulù, bǎochí pínghéng huò shǐyòng xiǎo wùpǐn fāngmiàn yǒu kùnnán.&lt;/p&gt;
&lt;p&gt;4. Sensory Needs / 感官需要 / Gǎnguān xūyào&lt;/p&gt;
&lt;p&gt;The child may have difficulty seeing, hearing, or responding comfortably to sensory experiences.&lt;/p&gt;
&lt;p&gt;儿童可能在视觉、听觉或适应感官刺激方面有困难。&lt;/p&gt;
&lt;p&gt;Értóng kěnéng zài shìjué, tīngjué huò shìyìng gǎnguān cìjī fāngmiàn yǒu kùnnán.&lt;/p&gt;
&lt;p&gt;5. Social and Emotional Development / 社交与情绪发展 / Shèjiāo yǔ qíngxù fāzhǎn&lt;/p&gt;
&lt;p&gt;The child may need support to communicate with others, manage emotions, or join group activities.&lt;/p&gt;
&lt;p&gt;儿童可能需要帮助来与他人沟通、管理情绪或参加集体活动。&lt;/p&gt;
&lt;p&gt;Értóng kěnéng xūyào bāngzhù lái yǔ tārén gōutōng, guǎnlǐ qíngxù huò cānjiā jítǐ huódòng.&lt;/p&gt;
&lt;p&gt;Important / 重要提醒 / Zhòngyào tíxǐng&lt;/p&gt;
&lt;p&gt;A single behaviour does not mean that a child has a disability.&lt;/p&gt;
&lt;p&gt;单一的行为并不代表儿童有残障。&lt;/p&gt;
&lt;p&gt;Dānyī de xíngwéi bìng bù dàibiǎo értóng yǒu cánzhàng.&lt;/p&gt;
&lt;p&gt;Teachers should observe the child over time, consider age and language development, and discuss concerns with parents.&lt;/p&gt;
&lt;p&gt;教师应该持续观察儿童，考虑年龄和语言发展，并与家长讨论有关问题。&lt;/p&gt;
&lt;p&gt;Jiàoshī yīnggāi chíxù guānchá értóng, kǎolǜ niánlíng hé yǔyán fāzhǎn, bìng yǔ jiāzhǎng tǎolùn yǒuguān wèntí.&lt;/p&gt;
&lt;p&gt;Formal assessment should be carried out by appropriately qualified professionals.&lt;/p&gt;
&lt;p&gt;正式评估应该由具备适当资格的专业人员进行。&lt;/p&gt;
&lt;p&gt;Zhèngshì pínggū yīnggāi yóu jùbèi shìdàng zīgé de zhuānyè rényuán jìnxíng.&lt;/p&gt;
&lt;h3&gt;1.2.5 Common Categories and Characteristics&lt;/h3&gt;
&lt;p&gt;常见类别与特征&lt;/p&gt;
&lt;p&gt;Chángjiàn lèibié yǔ tèzhēng&lt;/p&gt;
&lt;p&gt;The following examples introduce some common categories of special educational needs.&lt;/p&gt;
&lt;p&gt;以下例子介绍一些常见的特殊教育需要类别。&lt;/p&gt;
&lt;p&gt;Yǐxià lìzi jièshào yìxiē chángjiàn de tèshū jiàoyù xūyào lèibié.&lt;/p&gt;
&lt;p&gt;1. Communication Difficulties&lt;/p&gt;
&lt;p&gt;沟通困难&lt;/p&gt;
&lt;p&gt;Gōutōng kùnnán&lt;/p&gt;
&lt;p&gt;A child may have difficulty speaking clearly or understanding language.&lt;/p&gt;
&lt;p&gt;儿童可能难以清楚说话或理解语言。&lt;/p&gt;
&lt;p&gt;Értóng kěnéng nányǐ qīngchǔ shuōhuà huò lǐjiě yǔyán.&lt;/p&gt;
&lt;div class=&quot;placeholder&quot; role=&quot;img&quot; aria-label=&quot;IMAGE PLACEHOLDER — Preschool child using picture communication board with teacher&quot;&gt;🖼 [IMAGE PLACEHOLDER — Preschool child using picture communication board with teacher]&lt;/div&gt;
&lt;p&gt;2. Intellectual and Developmental Disabilities&lt;/p&gt;
&lt;p&gt;智力与发展障碍&lt;/p&gt;
&lt;p&gt;Zhìlì yǔ fāzhǎn zhàng&amp;#x27;ài&lt;/p&gt;
&lt;p&gt;A child may need more support to learn, solve problems, or develop daily living skills.&lt;/p&gt;
&lt;p&gt;儿童可能需要更多支持来学习、解决问题或发展日常生活技能。&lt;/p&gt;
&lt;p&gt;Értóng kěnéng xūyào gèng duō zhīchí lái xuéxí, jiějué wèntí huò fāzhǎn rìcháng shēnghuó jìnéng.&lt;/p&gt;
&lt;div class=&quot;placeholder&quot; role=&quot;img&quot; aria-label=&quot;IMAGE PLACEHOLDER — Preschool child and teacher working with shape-matching puzzle&quot;&gt;🖼 [IMAGE PLACEHOLDER — Preschool child and teacher working with shape-matching puzzle]&lt;/div&gt;
&lt;p&gt;3. Hearing Impairment&lt;/p&gt;
&lt;p&gt;听力障碍&lt;/p&gt;
&lt;p&gt;Tīnglì zhàng&amp;#x27;ài&lt;/p&gt;
&lt;p&gt;A child may have difficulty hearing speech or other sounds.&lt;/p&gt;
&lt;p&gt;儿童可能难以听清说话声或其他声音。&lt;/p&gt;
&lt;p&gt;Értóng kěnéng nányǐ tīng qīng shuōhuà shēng huò qítā shēngyīn.&lt;/p&gt;
&lt;div class=&quot;placeholder&quot; role=&quot;img&quot; aria-label=&quot;IMAGE PLACEHOLDER — Child with hearing aids in preschool&quot;&gt;🖼 [IMAGE PLACEHOLDER — Child with hearing aids in preschool]&lt;/div&gt;
&lt;p&gt;4. Visual Impairment&lt;/p&gt;
&lt;p&gt;视觉障碍&lt;/p&gt;
&lt;p&gt;Shìjué zhàng&amp;#x27;ài&lt;/p&gt;
&lt;p&gt;A child may have difficulty seeing pictures, objects, or written information.&lt;/p&gt;
&lt;p&gt;儿童可能难以看清图片、物品或文字信息。&lt;/p&gt;
&lt;p&gt;Értóng kěnéng nányǐ kàn qīng túpiàn, wùpǐn huò wénzì xìnxī.&lt;/p&gt;
&lt;div class=&quot;placeholder&quot; role=&quot;img&quot; aria-label=&quot;IMAGE PLACEHOLDER — Child using tactile picture book or braille materials&quot;&gt;🖼 [IMAGE PLACEHOLDER — Child using tactile picture book or braille materials]&lt;/div&gt;
&lt;p&gt;5. Physical Disabilities&lt;/p&gt;
&lt;p&gt;肢体障碍&lt;/p&gt;
&lt;p&gt;Zhītǐ zhàng&amp;#x27;ài&lt;/p&gt;
&lt;p&gt;A child may have difficulty with movement, balance, or coordination.&lt;/p&gt;
&lt;p&gt;儿童可能在动作、平衡或协调方面有困难。&lt;/p&gt;
&lt;p&gt;Értóng kěnéng zài dòngzuò, pínghéng huò xiétiáo fāngmiàn yǒu kùnnán.&lt;/p&gt;
&lt;div class=&quot;placeholder&quot; role=&quot;img&quot; aria-label=&quot;IMAGE PLACEHOLDER — Child in wheelchair participating in preschool table activity&quot;&gt;🖼 [IMAGE PLACEHOLDER — Child in wheelchair participating in preschool table activity]&lt;/div&gt;
&lt;p&gt;6. Autism Spectrum Disorder (ASD)&lt;/p&gt;
&lt;p&gt;孤独症谱系障碍（自闭症谱系障碍）&lt;/p&gt;
&lt;p&gt;Gūdúzhèng pǔxì zhàng&amp;#x27;ài (zìbìzhèng pǔxì zhàng&amp;#x27;ài)&lt;/p&gt;
&lt;p&gt;A child may communicate or interact differently, prefer routines, or have sensory differences.&lt;/p&gt;
&lt;p&gt;儿童可能有不同的沟通和互动方式、喜欢固定的日常安排，或有不同的感官反应。&lt;/p&gt;
&lt;p&gt;Értóng kěnéng yǒu bùtóng de gōutōng hé hùdòng fāngshì, xǐhuān gùdìng de rìcháng ānpái, huò yǒu bùtóng de gǎnguān fǎnyìng.&lt;/p&gt;
&lt;div class=&quot;placeholder&quot; role=&quot;img&quot; aria-label=&quot;IMAGE PLACEHOLDER — Autistic preschool child using visual schedule&quot;&gt;🖼 [IMAGE PLACEHOLDER — Autistic preschool child using visual schedule]&lt;/div&gt;
&lt;p&gt;7. Attention Deficit Hyperactivity Disorder (ADHD)&lt;/p&gt;
&lt;p&gt;注意力缺陷多动障碍&lt;/p&gt;
&lt;p&gt;Zhùyìlì quēxiàn duōdòng zhàng&amp;#x27;ài&lt;/p&gt;
&lt;p&gt;A child may have difficulty maintaining attention, controlling impulses, or managing activity levels.&lt;/p&gt;
&lt;p&gt;儿童可能难以保持注意力、控制冲动或调节活动量。&lt;/p&gt;
&lt;p&gt;Értóng kěnéng nányǐ bǎochí zhùyìlì, kòngzhì chōngdòng huò tiáojié huódòngliàng.&lt;/p&gt;
&lt;div class=&quot;placeholder&quot; role=&quot;img&quot; aria-label=&quot;IMAGE PLACEHOLDER — Preschool child taking movement break&quot;&gt;🖼 [IMAGE PLACEHOLDER — Preschool child taking movement break]&lt;/div&gt;
&lt;p&gt;These characteristics are examples only. Children within the same category can have very different strengths and needs.&lt;/p&gt;
&lt;p&gt;这些特征只是例子。同一类别的儿童也可能有非常不同的优点和需要。&lt;/p&gt;
&lt;p&gt;Zhèxiē tèzhēng zhǐ shì lìzi. Tóng yī lèibié de értóng yě kěnéng yǒu fēicháng bùtóng de yōudiǎn hé xūyào.&lt;/p&gt;
&lt;h3&gt;1.2.6 Supporting Children with Special Needs&lt;/h3&gt;
&lt;p&gt;支持有特殊需要的儿童&lt;/p&gt;
&lt;p&gt;Zhīchí yǒu tèshū xūyào de értóng&lt;/p&gt;
&lt;p&gt;Teachers can make simple changes to help children participate in classroom activities.&lt;/p&gt;
&lt;p&gt;教师可以作出简单的调整，帮助儿童参与课堂活动。&lt;/p&gt;
&lt;p&gt;Jiàoshī kěyǐ zuòchū jiǎndān de tiáozhěng, bāngzhù értóng cānyù kètáng huódòng.&lt;/p&gt;
&lt;div class=&quot;table-scroll&quot;&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;Child’s need 儿童的需要&lt;/td&gt;&lt;td&gt;Possible support 支持方法&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Difficulty hearing 听力困难&lt;/td&gt;&lt;td&gt;Face the child and use pictures. 面向儿童并使用图片。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Difficulty seeing 视觉困难&lt;/td&gt;&lt;td&gt;Use large pictures and clear contrast. 使用大图片和清晰的颜色对比。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Difficulty communicating 沟通困难&lt;/td&gt;&lt;td&gt;Use gestures and picture cards. 使用手势和图片卡。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Difficulty moving 行动困难&lt;/td&gt;&lt;td&gt;Provide accessible space and suitable materials. 提供无障碍空间和适当的材料。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Difficulty following routines 难以遵循日常安排&lt;/td&gt;&lt;td&gt;Use a visual schedule. 使用视觉日程表。&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;The table is a quick-reference summary. The example below shows the complete trilingual format.&lt;/p&gt;
&lt;p&gt;Example / 例子 / Lìzi&lt;/p&gt;
&lt;p&gt;A teacher uses picture cards to show the steps for washing hands.&lt;/p&gt;
&lt;p&gt;教师使用图片卡展示洗手的步骤。&lt;/p&gt;
&lt;p&gt;Jiàoshī shǐyòng túpiàn kǎ zhǎnshì xǐshǒu de bùzhòu.&lt;/p&gt;
&lt;p&gt;This helps children who find spoken instructions difficult to follow.&lt;/p&gt;
&lt;p&gt;这可以帮助难以理解口头指示的儿童。&lt;/p&gt;
&lt;p&gt;Zhè kěyǐ bāngzhù nányǐ lǐjiě kǒutóu zhǐshì de értóng.&lt;/p&gt;
&lt;h3&gt;Hands-on Activity 2: Observe, Do Not Diagnose&lt;/h3&gt;
&lt;p&gt;实践活动二：观察，而不是诊断&lt;/p&gt;
&lt;p&gt;Shíjiàn huódòng èr: Guānchá, ér bú shì zhěnduàn&lt;/p&gt;
&lt;p&gt;Case Study / 案例研究 / Ànlì yánjiū&lt;/p&gt;
&lt;p&gt;Mei is a five-year-old preschool child.&lt;/p&gt;
&lt;p&gt;美美是一名五岁的幼儿园儿童。&lt;/p&gt;
&lt;p&gt;Měiměi shì yì míng wǔ suì de yòu&amp;#x27;éryuán értóng.&lt;/p&gt;
&lt;p&gt;She enjoys drawing and building blocks.&lt;/p&gt;
&lt;p&gt;她喜欢画画和玩积木。&lt;/p&gt;
&lt;p&gt;Tā xǐhuān huàhuà hé wán jīmù.&lt;/p&gt;
&lt;p&gt;However, she sometimes has difficulty following long spoken instructions.&lt;/p&gt;
&lt;p&gt;但是，她有时难以理解较长的口头指示。&lt;/p&gt;
&lt;p&gt;Dànshì, tā yǒushí nányǐ lǐjiě jiào cháng de kǒutóu zhǐshì.&lt;/p&gt;
&lt;p&gt;She follows instructions more easily when the teacher uses pictures.&lt;/p&gt;
&lt;p&gt;当教师使用图片时，她更容易理解指示。&lt;/p&gt;
&lt;p&gt;Dāng jiàoshī shǐyòng túpiàn shí, tā gèng róngyì lǐjiě zhǐshì.&lt;/p&gt;
&lt;p&gt;Discussion Questions / 讨论问题 / Tǎolùn wèntí&lt;/p&gt;
&lt;p&gt;1. What are Mei&amp;#x27;s strengths?&lt;/p&gt;
&lt;p&gt;美美有哪些优点？&lt;/p&gt;
&lt;p&gt;Měiměi yǒu nǎxiē yōudiǎn?&lt;/p&gt;
&lt;p&gt;2. What difficulty has the teacher observed?&lt;/p&gt;
&lt;p&gt;教师观察到了什么困难？&lt;/p&gt;
&lt;p&gt;Jiàoshī guānchá dào le shénme kùnnán?&lt;/p&gt;
&lt;p&gt;3. How can the teacher support Mei without making a diagnosis?&lt;/p&gt;
&lt;p&gt;教师如何在不作出诊断的情况下支持美美？&lt;/p&gt;
&lt;p&gt;Jiàoshī rúhé zài bú zuòchū zhěnduàn de qíngkuàng xià zhīchí Měiměi?&lt;/p&gt;
&lt;p&gt;Suggested Response / 参考答案 / Cānkǎo dá&amp;#x27;àn&lt;/p&gt;
&lt;p&gt;The teacher can use short instructions, picture cards, and demonstrations.&lt;/p&gt;
&lt;p&gt;教师可以使用简短的指示、图片卡和示范。&lt;/p&gt;
&lt;p&gt;Jiàoshī kěyǐ shǐyòng jiǎnduǎn de zhǐshì, túpiàn kǎ hé shìfàn.&lt;/p&gt;
&lt;p&gt;The teacher should continue observing Mei and communicate with her family.&lt;/p&gt;
&lt;p&gt;教师应该继续观察美美，并与她的家人沟通。&lt;/p&gt;
&lt;p&gt;Jiàoshī yīnggāi jìxù guānchá Měiměi, bìng yǔ tā de jiārén gōutōng.&lt;/p&gt;
&lt;h3&gt;Topic 1 Summary&lt;/h3&gt;
&lt;p&gt;课题一总结&lt;/p&gt;
&lt;p&gt;Kètí yī zǒngjié&lt;/p&gt;
&lt;p&gt;1. Special education supports children with different learning needs.&lt;/p&gt;
&lt;p&gt;特殊教育支持有不同学习需要的儿童。&lt;/p&gt;
&lt;p&gt;Tèshū jiàoyù zhīchí yǒu bùtóng xuéxí xūyào de értóng.&lt;/p&gt;
&lt;p&gt;2. Inclusive education encourages children of different abilities to learn together.&lt;/p&gt;
&lt;p&gt;融合教育鼓励不同能力的儿童一起学习。&lt;/p&gt;
&lt;p&gt;Rónghé jiàoyù gǔlì bùtóng nénglì de értóng yìqǐ xuéxí.&lt;/p&gt;
&lt;p&gt;3. Disability is influenced by both individual impairments and environmental barriers.&lt;/p&gt;
&lt;p&gt;残障受到个人功能障碍和环境障碍的共同影响。&lt;/p&gt;
&lt;p&gt;Cánzhàng shòudào gèrén gōngnéng zhàng&amp;#x27;ài hé huánjìng zhàng&amp;#x27;ài de gòngtóng yǐngxiǎng.&lt;/p&gt;
&lt;p&gt;4. Every child has different strengths, abilities, and needs.&lt;/p&gt;
&lt;p&gt;每个儿童都有不同的优点、能力和需要。&lt;/p&gt;
&lt;p&gt;Měi gè értóng dōu yǒu bùtóng de yōudiǎn, nénglì hé xūyào.&lt;/p&gt;
&lt;p&gt;5. Teachers should observe, support, and include children rather than diagnose them.&lt;/p&gt;
&lt;p&gt;教师应该观察、支持和接纳儿童，而不是自行诊断。&lt;/p&gt;
&lt;p&gt;Jiàoshī yīnggāi guānchá, zhīchí hé jiēnà értóng, ér bú shì zìxíng zhěnduàn.&lt;/p&gt;&lt;/main&gt;&lt;script&gt;

const questions=[{&quot;stem&quot;: [&quot;Which statement best describes the main purpose of special education?&quot;, &quot;以下哪一项最能说明特殊教育的主要目的？&quot;, &quot;Yǐxià nǎ yí xiàng zuì néng shuōmíng tèshū jiàoyù de zhǔyào mùdì?&quot;], &quot;options&quot;: {&quot;A&quot;: [&quot;To provide separate learning programmes for all children with disabilities.&quot;, &quot;为所有残障儿童提供独立的学习课程。&quot;, &quot;Wèi suǒyǒu cánzhàng értóng tígōng dúlì de xuéxí kèchéng.&quot;], &quot;B&quot;: [&quot;To help children achieve the same learning outcomes at the same speed.&quot;, &quot;帮助儿童以相同的速度达到相同的学习成果。&quot;, &quot;Bāngzhù értóng yǐ xiāngtóng de sùdù dádào xiāngtóng de xuéxí chéngguǒ.&quot;], &quot;C&quot;: [&quot;To provide suitable teaching and support according to individual learning needs.&quot;, &quot;根据个人学习需要提供适当的教学和支持。&quot;, &quot;Gēnjù gèrén xuéxí xūyào tígōng shìdàng de jiàoxué hé zhīchí.&quot;], &quot;D&quot;: [&quot;To focus mainly on improving children&#x27;s academic performance.&quot;, &quot;主要关注提高儿童的学业表现。&quot;, &quot;Zhǔyào guānzhù tígāo értóng de xuéyè biǎoxiàn.&quot;]}}, {&quot;stem&quot;: [&quot;A preschool teacher allows children with different abilities to join the same art activity but provides different tools when needed. Which principle is best demonstrated?&quot;, &quot;一位幼儿教师让不同能力的儿童参加相同的美术活动，并在需要时提供不同的工具。这最能体现哪一项原则？&quot;, &quot;Yí wèi yòu&#x27;ér jiàoshī ràng bùtóng nénglì de értóng cānjiā xiāngtóng de měishù huódòng, bìng zài xūyào shí tígōng bùtóng de gōngjù. Zhè zuì néng tǐxiàn nǎ yí xiàng yuánzé?&quot;], &quot;options&quot;: {&quot;A&quot;: [&quot;Inclusive education through appropriate classroom adaptations.&quot;, &quot;通过适当的课堂调整实施融合教育。&quot;, &quot;Tōngguò shìdàng de kètáng tiáozhěng shíshī rónghé jiàoyù.&quot;], &quot;B&quot;: [&quot;Individual instruction through separate learning activities.&quot;, &quot;通过独立的学习活动进行个别教学。&quot;, &quot;Tōngguò dúlì de xuéxí huódòng jìnxíng gèbié jiàoxué.&quot;], &quot;C&quot;: [&quot;Early intervention through formal developmental assessment.&quot;, &quot;通过正式的发展评估进行早期干预。&quot;, &quot;Tōngguò zhèngshì de fāzhǎn pínggū jìnxíng zǎoqī gānyù.&quot;], &quot;D&quot;: [&quot;Specialised teaching through a separate curriculum.&quot;, &quot;通过独立的课程进行专门教学。&quot;, &quot;Tōngguò dúlì de kèchéng jìnxíng zhuānmén jiàoxué.&quot;]}}, {&quot;stem&quot;: [&quot;A child regularly finds long spoken instructions difficult to follow. What is the most appropriate first response by the teacher?&quot;, &quot;一个儿童经常难以理解较长的口头指示。教师首先应该采取什么最适当的行动？&quot;, &quot;Yí gè értóng jīngcháng nányǐ lǐjiě jiào cháng de kǒutóu zhǐshì. Jiàoshī shǒuxiān yīnggāi cǎiqǔ shénme zuì shìdàng de xíngdòng?&quot;], &quot;options&quot;: {&quot;A&quot;: [&quot;Ask the parents to arrange a formal assessment before offering support.&quot;, &quot;要求家长先安排正式评估，再提供支持。&quot;, &quot;Yāoqiú jiāzhǎng xiān ānpái zhèngshì pínggū, zài tígōng zhīchí.&quot;], &quot;B&quot;: [&quot;Move the child to an individual activity to reduce language demands.&quot;, &quot;让儿童进行个别活动，以减少语言要求。&quot;, &quot;Ràng értóng jìnxíng gèbié huódòng, yǐ jiǎnshǎo yǔyán yāoqiú.&quot;], &quot;C&quot;: [&quot;Repeat the same instructions more frequently to improve understanding.&quot;, &quot;更频繁地重复相同的指示，以提高理解能力。&quot;, &quot;Gèng pínfán de chóngfù xiāngtóng de zhǐshì, yǐ tígāo lǐjiě nénglì.&quot;], &quot;D&quot;: [&quot;Observe the child and try shorter instructions with visual support.&quot;, &quot;观察儿童，并尝试使用较短的指示和视觉支持。&quot;, &quot;Guānchá értóng, bìng chángshì shǐyòng jiào duǎn de zhǐshì hé shìjué zhīchí.&quot;]}}, {&quot;stem&quot;: [&quot;Which situation best illustrates the social model of disability?&quot;, &quot;以下哪一种情况最能体现残障的社会模式？&quot;, &quot;Yǐxià nǎ yì zhǒng qíngkuàng zuì néng tǐxiàn cánzhàng de shèhuì móshì?&quot;], &quot;options&quot;: {&quot;A&quot;: [&quot;A specialist recommends hearing aids for a child with hearing loss.&quot;, &quot;专业人员建议有听力损失的儿童使用助听器。&quot;, &quot;Zhuānyè rényuán jiànyì yǒu tīnglì sǔnshī de értóng shǐyòng zhùtīngqì.&quot;], &quot;B&quot;: [&quot;A preschool installs a ramp so a child using a wheelchair can enter independently.&quot;, &quot;幼儿园安装斜坡道，让使用轮椅的儿童能够独立进入。&quot;, &quot;Yòu&#x27;éryuán ānzhuāng xiépōdào, ràng shǐyòng lúnyǐ de értóng nénggòu dúlì jìnrù.&quot;], &quot;C&quot;: [&quot;A therapist evaluates a child&#x27;s movement and coordination skills.&quot;, &quot;治疗师评估儿童的动作和协调能力。&quot;, &quot;Zhìliáoshī pínggū értóng de dòngzuò hé xiétiáo nénglì.&quot;], &quot;D&quot;: [&quot;A teacher records a child&#x27;s developmental progress for a specialist.&quot;, &quot;教师记录儿童的发展进度，供专业人员参考。&quot;, &quot;Jiàoshī jìlù értóng de fāzhǎn jìndù, gōng zhuānyè rényuán cānkǎo.&quot;]}}, {&quot;stem&quot;: [&quot;Which statement best reflects a rights-based view of disability?&quot;, &quot;以下哪一项最能体现以权利为基础的残障观？&quot;, &quot;Yǐxià nǎ yí xiàng zuì néng tǐxiàn yǐ quánlì wéi jīchǔ de cánzhàng guān?&quot;], &quot;options&quot;: {&quot;A&quot;: [&quot;Children with disabilities should participate when they have mastered the required skills.&quot;, &quot;残障儿童应该在掌握所需技能后才参与活动。&quot;, &quot;Cánzhàng értóng yīnggāi zài zhǎngwò suǒ xū jìnéng hòu cái cānyù huódòng.&quot;], &quot;B&quot;: [&quot;Children with disabilities should receive support mainly from trained specialists.&quot;, &quot;残障儿童应该主要由受过训练的专业人员提供支持。&quot;, &quot;Cánzhàng értóng yīnggāi zhǔyào yóu shòuguò xùnliàn de zhuānyè rényuán tígōng zhīchí.&quot;], &quot;C&quot;: [&quot;Children with disabilities have equal rights to education, respect and participation.&quot;, &quot;残障儿童享有平等的教育、尊重和参与权利。&quot;, &quot;Cánzhàng értóng xiǎngyǒu píngděng de jiàoyù, zūnzhòng hé cānyù quánlì.&quot;], &quot;D&quot;: [&quot;Children with disabilities should follow individual learning goals instead of group goals.&quot;, &quot;残障儿童应该遵循个人学习目标，而不是集体目标。&quot;, &quot;Cánzhàng értóng yīnggāi zūnxún gèrén xuéxí mùbiāo, ér bú shì jítǐ mùbiāo.&quot;]}}, {&quot;stem&quot;: [&quot;A five-year-old child sometimes struggles to communicate during group activities but communicates comfortably during play with familiar friends. What is the most reasonable conclusion?&quot;, &quot;一个五岁的儿童有时在集体活动中难以沟通，但与熟悉的朋友玩耍时能够自在地交流。以下哪一个结论最合理？&quot;, &quot;Yí gè wǔ suì de értóng yǒushí zài jítǐ huódòng zhōng nányǐ gōutōng, dàn yǔ shúxī de péngyǒu wánshuǎ shí nénggòu zìzài de jiāoliú. Yǐxià nǎ yí gè jiélùn zuì hélǐ?&quot;], &quot;options&quot;: {&quot;A&quot;: [&quot;The child needs continued observation across different situations.&quot;, &quot;儿童需要在不同情境下接受持续观察。&quot;, &quot;Értóng xūyào zài bùtóng qíngjìng xià jiēshòu chíxù guānchá.&quot;], &quot;B&quot;: [&quot;The child probably has a communication disorder that affects group learning.&quot;, &quot;儿童可能有影响集体学习的沟通障碍。&quot;, &quot;Értóng kěnéng yǒu yǐngxiǎng jítǐ xuéxí de gōutōng zhàng&#x27;ài.&quot;], &quot;C&quot;: [&quot;The child should receive individual language teaching before group activities.&quot;, &quot;儿童应该先接受个别语言教学，再参加集体活动。&quot;, &quot;Értóng yīnggāi xiān jiēshòu gèbié yǔyán jiàoxué, zài cānjiā jítǐ huódòng.&quot;], &quot;D&quot;: [&quot;The child is likely experiencing a temporary developmental delay.&quot;, &quot;儿童可能正在经历暂时性的发展迟缓。&quot;, &quot;Értóng kěnéng zhèngzài jīnglì zànshíxìng de fāzhǎn chíhuǎn.&quot;]}}, {&quot;stem&quot;: [&quot;A teacher notices that a child has difficulty seeing small pictures during story time. Which adaptation would most directly address this difficulty?&quot;, &quot;教师注意到一个儿童在故事时间难以看清小图片。哪一种调整最能直接解决这个困难？&quot;, &quot;Jiàoshī zhùyì dào yí gè értóng zài gùshi shíjiān nányǐ kàn qīng xiǎo túpiàn. Nǎ yì zhǒng tiáozhěng zuì néng zhíjiē jiějué zhège kùnnán?&quot;], &quot;options&quot;: {&quot;A&quot;: [&quot;Give the child extra time to answer questions about the story.&quot;, &quot;给予儿童额外时间回答故事问题。&quot;, &quot;Jǐyǔ értóng éwài shíjiān huídá gùshi wèntí.&quot;], &quot;B&quot;: [&quot;Repeat the story using shorter spoken sentences.&quot;, &quot;使用较短的口头句子重复讲述故事。&quot;, &quot;Shǐyòng jiào duǎn de kǒutóu jùzi chóngfù jiǎngshù gùshi.&quot;], &quot;C&quot;: [&quot;Allow the child to listen without looking at the pictures.&quot;, &quot;允许儿童只听故事而不看图片。&quot;, &quot;Yǔnxǔ értóng zhǐ tīng gùshi ér bú kàn túpiàn.&quot;], &quot;D&quot;: [&quot;Use larger, high-contrast pictures at a suitable viewing distance.&quot;, &quot;在适当的观看距离使用较大、对比鲜明的图片。&quot;, &quot;Zài shìdàng de guānkàn jùlí shǐyòng jiào dà, duìbǐ xiānmíng de túpiàn.&quot;]}}, {&quot;stem&quot;: [&quot;Which statement best explains the relationship between disability and special educational needs?&quot;, &quot;以下哪一项最能解释残障与特殊教育需要之间的关系？&quot;, &quot;Yǐxià nǎ yí xiàng zuì néng jiěshì cánzhàng yǔ tèshū jiàoyù xūyào zhījiān de guānxì?&quot;], &quot;options&quot;: {&quot;A&quot;: [&quot;Every child with a disability requires the same type of special educational support.&quot;, &quot;每个残障儿童都需要相同类型的特殊教育支持。&quot;, &quot;Měi gè cánzhàng értóng dōu xūyào xiāngtóng lèixíng de tèshū jiàoyù zhīchí.&quot;], &quot;B&quot;: [&quot;A child may have special educational needs without having a diagnosed disability.&quot;, &quot;儿童即使没有被诊断为有残障，也可能有特殊教育需要。&quot;, &quot;Értóng jíshǐ méiyǒu bèi zhěnduàn wéi yǒu cánzhàng, yě kěnéng yǒu tèshū jiàoyù xūyào.&quot;], &quot;C&quot;: [&quot;Special educational needs are identified only after a medical diagnosis.&quot;, &quot;特殊教育需要只有在医学诊断后才能被识别。&quot;, &quot;Tèshū jiàoyù xūyào zhǐyǒu zài yīxué zhěnduàn hòu cáinéng bèi shíbié.&quot;], &quot;D&quot;: [&quot;Children with similar disabilities usually have similar educational needs.&quot;, &quot;有相似残障的儿童通常有相似的教育需要。&quot;, &quot;Yǒu xiāngsì cánzhàng de értóng tōngcháng yǒu xiāngsì de jiàoyù xūyào.&quot;]}}, {&quot;stem&quot;: [&quot;A preschool child becomes uncomfortable with loud sounds and prefers a predictable daily routine. Which interpretation is most appropriate?&quot;, &quot;一个幼儿园儿童对大声响感到不舒服，并喜欢有规律的日常安排。以下哪一种解释最适当？&quot;, &quot;Yí gè yòu&#x27;éryuán értóng duì dà shēngxiǎng gǎndào bù shūfu, bìng xǐhuān yǒu guīlǜ de rìcháng ānpái. Yǐxià nǎ yì zhǒng jiěshì zuì shìdàng?&quot;], &quot;options&quot;: {&quot;A&quot;: [&quot;These behaviours are sufficient to identify autism spectrum disorder.&quot;, &quot;这些行为足以识别孤独症谱系障碍。&quot;, &quot;Zhèxiē xíngwéi zúyǐ shíbié gūdúzhèng pǔxì zhàng&#x27;ài.&quot;], &quot;B&quot;: [&quot;These behaviours indicate that the child has difficulty understanding social rules.&quot;, &quot;这些行为表明儿童难以理解社交规则。&quot;, &quot;Zhèxiē xíngwéi biǎomíng értóng nányǐ lǐjiě shèjiāo guīzé.&quot;], &quot;C&quot;: [&quot;These behaviours may suggest sensory needs but do not establish a diagnosis.&quot;, &quot;这些行为可能反映感官需要，但不能作为诊断依据。&quot;, &quot;Zhèxiē xíngwéi kěnéng fǎnyìng gǎnguān xūyào, dàn bù néng zuòwéi zhěnduàn yījù.&quot;], &quot;D&quot;: [&quot;These behaviours show that the child needs a separate learning environment.&quot;, &quot;这些行为显示儿童需要独立的学习环境。&quot;, &quot;Zhèxiē xíngwéi xiǎnshì értóng xūyào dúlì de xuéxí huánjìng.&quot;]}}, {&quot;stem&quot;: [&quot;A teacher wants to support a child with special educational needs while encouraging independence. Which approach is most appropriate?&quot;, &quot;一位教师希望支持有特殊教育需要的儿童，同时鼓励其独立能力。以下哪一种方法最适当？&quot;, &quot;Yí wèi jiàoshī xīwàng zhīchí yǒu tèshū jiàoyù xūyào de értóng, tóngshí gǔlì qí dúlì nénglì. Yǐxià nǎ yì zhǒng fāngfǎ zuì shìdàng?&quot;], &quot;options&quot;: {&quot;A&quot;: [&quot;Complete difficult tasks for the child to reduce frustration.&quot;, &quot;替儿童完成困难的任务，以减少挫折感。&quot;, &quot;Tì értóng wánchéng kùnnán de rènwu, yǐ jiǎnshǎo cuòzhégǎn.&quot;], &quot;B&quot;: [&quot;Provide the same level of assistance throughout every activity.&quot;, &quot;在每项活动中始终提供相同程度的帮助。&quot;, &quot;Zài měi xiàng huódòng zhōng shǐzhōng tígōng xiāngtóng chéngdù de bāngzhù.&quot;], &quot;C&quot;: [&quot;Allow the child to work independently without additional guidance.&quot;, &quot;让儿童独立完成活动，不提供额外指导。&quot;, &quot;Ràng értóng dúlì wánchéng huódòng, bù tígōng éwài zhǐdǎo.&quot;], &quot;D&quot;: [&quot;Provide suitable assistance and gradually reduce it as the child&#x27;s skills improve.&quot;, &quot;提供适当帮助，并随着儿童能力的提高逐渐减少帮助。&quot;, &quot;Tígōng shìdàng bāngzhù, bìng suízhe értóng nénglì de tígāo zhújiàn jiǎnshǎo bāngzhù.&quot;]}}];

const explanations=[{&quot;key&quot;: &quot;C&quot;, &quot;options&quot;: {&quot;A&quot;: [&quot;Separate programmes may sometimes be used, but they are not required for every child with a disability.&quot;, &quot;有时可以使用独立课程，但并非每位残障儿童都需要。&quot;, &quot;Yǒushí kěyǐ shǐyòng dúlì kèchéng, dàn bìngfēi měi wèi cánzhàng értóng dōu xūyào.&quot;], &quot;B&quot;: [&quot;A common learning speed is not the aim; children learn at different rates.&quot;, &quot;目标不是让所有儿童以相同速度学习；儿童的学习速度各不相同。&quot;, &quot;Mùbiāo bú shì ràng suǒyǒu értóng yǐ xiāngtóng sùdù xuéxí; értóng de xuéxí sùdù gè bù xiāngtóng.&quot;], &quot;C&quot;: [&quot;Individualised teaching and support are central to special education.&quot;, &quot;个别化教学和支持是特殊教育的核心。&quot;, &quot;Gèbiéhuà jiàoxué hé zhīchí shì tèshū jiàoyù de héxīn.&quot;], &quot;D&quot;: [&quot;Special education also supports communication, participation, social skills and independence, not just academic performance.&quot;, &quot;特殊教育也支持沟通、参与、社交技能和独立能力，而不只是学业表现。&quot;, &quot;Tèshū jiàoyù yě zhīchí gōutōng, cānyù, shèjiāo jìnéng hé dúlì nénglì, ér bù zhǐ shì xuéyè biǎoxiàn.&quot;]}, &quot;summary&quot;: [&quot;Special education addresses individual needs and supports learning, development and participation.&quot;, &quot;特殊教育关注个人需要，并支持学习、发展和参与。&quot;, &quot;Tèshū jiàoyù guānzhù gèrén xūyào, bìng zhīchí xuéxí, fāzhǎn hé cānyù.&quot;]}, {&quot;key&quot;: &quot;A&quot;, &quot;options&quot;: {&quot;A&quot;: [&quot;Adapting tools within a shared activity supports inclusive participation.&quot;, &quot;在共同活动中调整工具，有助于儿童融合参与。&quot;, &quot;Zài gòngtóng huódòng zhōng tiáozhěng gōngjù, yǒuzhù yú értóng rónghé cānyù.&quot;], &quot;B&quot;: [&quot;The activity is shared, not a separate individual lesson.&quot;, &quot;这是共同活动，而不是独立的个别课程。&quot;, &quot;Zhè shì gòngtóng huódòng, ér bú shì dúlì de gèbié kèchéng.&quot;], &quot;C&quot;: [&quot;No formal developmental assessment is described.&quot;, &quot;题目没有描述正式的发展评估。&quot;, &quot;Tímù méiyǒu miáoshù zhèngshì de fāzhǎn pínggū.&quot;], &quot;D&quot;: [&quot;The teacher is adapting materials rather than using a separate curriculum.&quot;, &quot;教师是在调整材料，而不是使用独立的课程。&quot;, &quot;Jiàoshī shì zài tiáozhěng cáiliào, ér bú shì shǐyòng dúlì de kèchéng.&quot;]}, &quot;summary&quot;: [&quot;The teacher removes participation barriers while keeping children in a shared activity.&quot;, &quot;教师消除参与障碍，同时让儿童参加共同的活动。&quot;, &quot;Jiàoshī xiāochú cānyù zhàng&#x27;ài, tóngshí ràng értóng cānjiā gòngtóng de huódòng.&quot;]}, {&quot;key&quot;: &quot;D&quot;, &quot;options&quot;: {&quot;A&quot;: [&quot;Assessment may later be appropriate, but classroom support need not wait for it.&quot;, &quot;日后可能需要评估，但课堂支持不必等到评估完成才开始。&quot;, &quot;Rìhòu kěnéng xūyào pínggū, dàn kètáng zhīchí bú bì děng dào pínggū wánchéng cái kāishǐ.&quot;], &quot;B&quot;: [&quot;Separate activities are not the necessary first response and may reduce inclusion.&quot;, &quot;独立活动不一定是首要做法，而且可能减少融合参与。&quot;, &quot;Dúlì huódòng bù yídìng shì shǒuyào zuòfǎ, érqiě kěnéng jiǎnshǎo rónghé cānyù.&quot;], &quot;C&quot;: [&quot;Repeating long instructions without adapting them may not address comprehension difficulties.&quot;, &quot;如果不调整长指示，只是重复，可能无法解决理解困难。&quot;, &quot;Rúguǒ bù tiáozhěng cháng zhǐshì, zhǐ shì chóngfù, kěnéng wúfǎ jiějué lǐjiě kùnnan.&quot;], &quot;D&quot;: [&quot;Short instructions, visual support and observation directly address the classroom difficulty.&quot;, &quot;简短指示、视觉支持和观察能直接帮助解决课堂中的困难。&quot;, &quot;Jiǎnduǎn zhǐshì, shìjué zhīchí hé guānchá néng zhíjiē bāngzhù jiějué kètáng zhōng de kùnnan.&quot;]}, &quot;summary&quot;: [&quot;Observation and suitable teaching adjustments can begin without waiting for a diagnosis.&quot;, &quot;即使尚未获得诊断，也可以开始观察并作出适当的教学调整。&quot;, &quot;Jíshǐ shàngwèi huòdé zhěnduàn, yě kěyǐ kāishǐ guānchá bìng zuòchū shìdàng de jiàoxué tiáozhěng.&quot;]}, {&quot;key&quot;: &quot;B&quot;, &quot;options&quot;: {&quot;A&quot;: [&quot;Hearing aids may help the child, but the focus is on individual equipment rather than removing an environmental barrier.&quot;, &quot;助听器可能帮助儿童，但重点是个人设备，而不是消除环境障碍。&quot;, &quot;Zhùtīngqì kěnéng bāngzhù értóng, dàn zhòngdiǎn shì gèrén shèbèi, ér bú shì xiāochú huánjìng zhàng&#x27;ài.&quot;], &quot;B&quot;: [&quot;A ramp removes an access barrier in the physical environment.&quot;, &quot;坡道能消除实体环境中的通行障碍。&quot;, &quot;Pōdào néng xiāochú shítǐ huánjìng zhōng de tōngxíng zhàng&#x27;ài.&quot;], &quot;C&quot;: [&quot;Evaluating movement focuses on the child’s functioning rather than changing environmental barriers.&quot;, &quot;评估行动能力关注儿童的功能，而不是改变环境障碍。&quot;, &quot;Pínggū xíngdòng nénglì guānzhù értóng de gōngnéng, ér bú shì gǎibiàn huánjìng zhàng&#x27;ài.&quot;], &quot;D&quot;: [&quot;Progress records may support assessment, but they do not themselves remove a social or physical barrier.&quot;, &quot;进步记录可能有助于评估，但记录本身不会消除社会或实体障碍。&quot;, &quot;Jìnbù jìlù kěnéng yǒuzhù yú pínggū, dàn jìlù běnshēn bú huì xiāochú shèhuì huò shítǐ zhàng&#x27;ài.&quot;]}, &quot;summary&quot;: [&quot;The social model emphasises removing environmental and social barriers.&quot;, &quot;社会模式强调消除环境和社会障碍。&quot;, &quot;Shèhuì móshì qiángdiào xiāochú huánjìng hé shèhuì zhàng&#x27;ài.&quot;]}, {&quot;key&quot;: &quot;C&quot;, &quot;options&quot;: {&quot;A&quot;: [&quot;Participation is a right and should not depend on first mastering a prescribed set of skills.&quot;, &quot;参与是一项权利，不应以先掌握规定的技能为条件。&quot;, &quot;Cānyù shì yí xiàng quánlì, bù yīng yǐ xiān zhǎngwò guīdìng de jìnéng wéi tiáojiàn.&quot;], &quot;B&quot;: [&quot;Specialists can help, but rights are not limited to specialist-provided support.&quot;, &quot;专业人员可以提供帮助，但儿童的权利不限于专业人员提供的支持。&quot;, &quot;Zhuānyè rényuán kěyǐ tígōng bāngzhù, dàn értóng de quánlì bú xiàn yú zhuānyè rényuán tígōng de zhīchí.&quot;], &quot;C&quot;: [&quot;Equal rights to education, dignity and participation define the rights-based approach.&quot;, &quot;平等享有教育、尊严和参与的权利，是以权利为本的方法的核心。&quot;, &quot;Píngděng xiǎngyǒu jiàoyù, zūnyán hé cānyù de quánlì, shì yǐ quánlì wéi běn de fāngfǎ de héxīn.&quot;], &quot;D&quot;: [&quot;Individual goals may be useful, but they do not replace a child’s right to join shared activities.&quot;, &quot;个人目标可能有用，但不能取代儿童参与共同活动的权利。&quot;, &quot;Gèrén mùbiāo kěnéng yǒuyòng, dàn bù néng qǔdài értóng cānyù gòngtóng huódòng de quánlì.&quot;]}, &quot;summary&quot;: [&quot;A rights-based view recognises equal human rights and meaningful participation.&quot;, &quot;以权利为本的观点承认平等人权和有意义的参与。&quot;, &quot;Yǐ quánlì wéi běn de guāndiǎn chéngrèn píngděng rénquán hé yǒu yìyì de cānyù.&quot;]}, {&quot;key&quot;: &quot;A&quot;, &quot;options&quot;: {&quot;A&quot;: [&quot;Observing across contexts helps identify patterns, strengths and suitable support.&quot;, &quot;在不同情境中观察，有助于发现行为模式、优势和适当的支持方式。&quot;, &quot;Zài bùtóng qíngjìng zhōng guānchá, yǒuzhù yú fāxiàn xíngwéi móshì, yōushì hé shìdàng de zhīchí fāngshì.&quot;], &quot;B&quot;: [&quot;A communication disorder cannot be inferred from this limited observation.&quot;, &quot;不能仅凭这项有限的观察就推断儿童有沟通障碍。&quot;, &quot;Bù néng jǐn píng zhè xiàng yǒuxiàn de guānchá jiù tuīduàn értóng yǒu gōutōng zhàng&#x27;ài.&quot;], &quot;C&quot;: [&quot;Individual teaching may be considered if needed, but is not established as necessary before group activities.&quot;, &quot;如有需要，可以考虑个别教学，但目前不能认定儿童在参加小组活动前必须接受个别教学。&quot;, &quot;Rú yǒu xūyào, kěyǐ kǎolǜ gèbié jiàoxué, dàn mùqián bù néng rèndìng értóng zài cānjiā xiǎozǔ huódòng qián bìxū jiēshòu gèbié jiàoxué.&quot;], &quot;D&quot;: [&quot;A developmental delay cannot be inferred or characterised as temporary from the information given.&quot;, &quot;根据所提供的信息，不能推断儿童有发展迟缓，也不能认定这种情况是暂时的。&quot;, &quot;Gēnjù suǒ tígōng de xìnxī, bù néng tuīduàn értóng yǒu fāzhǎn chíhuǎn, yě bù néng rèndìng zhè zhǒng qíngkuàng shì zànshí de.&quot;]}, &quot;summary&quot;: [&quot;Behaviour can vary with context. Teachers should gather observations rather than infer a diagnosis.&quot;, &quot;行为会因情境而变化。教师应收集观察资料，而不是推断诊断结果。&quot;, &quot;Xíngwéi huì yīn qíngjìng ér biànhuà. Jiàoshī yīng shōují guānchá zīliào, ér bú shì tuīduàn zhěnduàn jiéguǒ.&quot;]}, {&quot;key&quot;: &quot;D&quot;, &quot;options&quot;: {&quot;A&quot;: [&quot;Extra response time may help processing but does not improve visibility of small pictures.&quot;, &quot;给予更多回应时间可能有助于信息处理，但不会让小图片更清楚。&quot;, &quot;Jǐyǔ gèng duō huíyìng shíjiān kěnéng yǒuzhù yú xìnxī chǔlǐ, dàn bú huì ràng xiǎo túpiàn gèng qīngchu.&quot;], &quot;B&quot;: [&quot;Shorter spoken sentences may support language comprehension but not visual access.&quot;, &quot;较短的口头句子可能帮助理解语言，但不能改善视觉上的可及性。&quot;, &quot;Jiào duǎn de kǒutóu jùzi kěnéng bāngzhù lǐjiě yǔyán, dàn bù néng gǎishàn shìjué shàng de kějíxìng.&quot;], &quot;C&quot;: [&quot;Listening without pictures avoids the visual material rather than making it accessible.&quot;, &quot;只听故事而不看图片，是避开视觉材料，而不是让材料更容易观看。&quot;, &quot;Zhǐ tīng gùshi ér bú kàn túpiàn, shì bìkāi shìjué cáiliào, ér bú shì ràng cáiliào gèng róngyì guānkàn.&quot;], &quot;D&quot;: [&quot;Larger high-contrast images directly improve visual access to the story illustrations.&quot;, &quot;较大且对比度高的图片能直接改善儿童观看故事插图的能力。&quot;, &quot;Jiào dà qiě duìbǐdù gāo de túpiàn néng zhíjiē gǎishàn értóng guānkàn gùshi chātú de nénglì.&quot;]}, &quot;summary&quot;: [&quot;Larger, clearer visual materials directly address difficulty seeing small pictures.&quot;, &quot;更大、更清晰的视觉材料能直接帮助看不清小图片的儿童。&quot;, &quot;Gèng dà, gèng qīngxī de shìjué cáiliào néng zhíjiē bāngzhù kàn bù qīng xiǎo túpiàn de értóng.&quot;]}, {&quot;key&quot;: &quot;B&quot;, &quot;options&quot;: {&quot;A&quot;: [&quot;Children with disabilities differ in strengths, barriers and support needs.&quot;, &quot;残障儿童在优势、障碍和支持需要方面各不相同。&quot;, &quot;Cánzhàng értóng zài yōushì, zhàng&#x27;ài hé zhīchí xūyào fāngmiàn gè bù xiāngtóng.&quot;], &quot;B&quot;: [&quot;Educational support needs can be recognised through observation even without a formal diagnosis.&quot;, &quot;即使没有正式诊断，也可以通过观察识别教育支持需要。&quot;, &quot;Jíshǐ méiyǒu zhèngshì zhěnduàn, yě kěyǐ tōngguò guānchá shíbié jiàoyù zhīchí xūyào.&quot;], &quot;C&quot;: [&quot;A diagnosis is not a prerequisite for noticing or responding to educational needs.&quot;, &quot;注意到教育需要并作出回应，并不一定需要先有诊断。&quot;, &quot;Zhùyì dào jiàoyù xūyào bìng zuòchū huíyìng, bìng bù yídìng xūyào xiān yǒu zhěnduàn.&quot;], &quot;D&quot;: [&quot;Children sharing a disability category may still require very different support.&quot;, &quot;即使属于相同的障碍类别，儿童所需的支持也可能非常不同。&quot;, &quot;Jíshǐ shǔyú xiāngtóng de zhàng&#x27;ài lèibié, értóng suǒ xū de zhīchí yě kěnéng fēicháng bùtóng.&quot;]}, &quot;summary&quot;: [&quot;Educational needs depend on individual learning and participation, not solely on diagnostic labels.&quot;, &quot;教育需要取决于个人的学习和参与情况，而不只是诊断标签。&quot;, &quot;Jiàoyù xūyào qǔjué yú gèrén de xuéxí hé cānyù qíngkuàng, ér bù zhǐ shì zhěnduàn biāoqiān.&quot;]}, {&quot;key&quot;: &quot;C&quot;, &quot;options&quot;: {&quot;A&quot;: [&quot;These observations alone are insufficient to identify autism spectrum disorder.&quot;, &quot;单凭这些观察不足以识别自闭症谱系障碍。&quot;, &quot;Dān píng zhèxiē guānchá bù zú yǐ shíbié zìbìzhèng pǔxì zhàng&#x27;ài.&quot;], &quot;B&quot;: [&quot;Nothing in the description establishes difficulty understanding social rules.&quot;, &quot;描述中没有足够信息表明儿童难以理解社交规则。&quot;, &quot;Miáoshù zhōng méiyǒu zúgòu xìnxī biǎomíng értóng nányǐ lǐjiě shèjiāo guīzé.&quot;], &quot;C&quot;: [&quot;The behaviours may suggest sensory preferences or needs, but are not enough for a diagnosis.&quot;, &quot;这些行为可能反映感官偏好或需要，但不足以作出诊断。&quot;, &quot;Zhèxiē xíngwéi kěnéng fǎnyìng gǎnguān piānhào huò xūyào, dàn bù zú yǐ zuòchū zhěnduàn.&quot;], &quot;D&quot;: [&quot;Environmental adjustments may help without requiring a separate learning environment.&quot;, &quot;调整环境可能有所帮助，而不必安排独立的学习环境。&quot;, &quot;Tiáozhěng huánjìng kěnéng yǒu suǒ bāngzhù, ér bú bì ānpái dúlì de xuéxí huánjìng.&quot;]}, &quot;summary&quot;: [&quot;Sensory differences and routine preferences can occur for several reasons; they are not diagnostic on their own.&quot;, &quot;感官差异和对日常规律的偏好可能有多种原因；单凭这些表现不能作出诊断。&quot;, &quot;Gǎnguān chāyì hé duì rìcháng guīlǜ de piānhào kěnéng yǒu duō zhǒng yuányīn; dān píng zhèxiē biǎoxiàn bù néng zuòchū zhěnduàn.&quot;]}, {&quot;key&quot;: &quot;D&quot;, &quot;options&quot;: {&quot;A&quot;: [&quot;Doing tasks for the child may reduce opportunities to practise and become independent.&quot;, &quot;替儿童完成任务可能减少他们练习和培养独立能力的机会。&quot;, &quot;Tì értóng wánchéng rènwù kěnéng jiǎnshǎo tāmen liànxí hé péiyǎng dúlì nénglì de jīhuì.&quot;], &quot;B&quot;: [&quot;Fixed assistance does not respond to changes in the child’s skills and needs.&quot;, &quot;固定不变的帮助无法回应儿童技能和需要的变化。&quot;, &quot;Gùdìng bú biàn de bāngzhù wúfǎ huíyìng értóng jìnéng hé xūyào de biànhuà.&quot;], &quot;C&quot;: [&quot;Withholding all guidance may make tasks inaccessible or frustrating.&quot;, &quot;完全不给予指导可能使任务难以完成，或让儿童感到挫折。&quot;, &quot;Wánquán bù jǐyǔ zhǐdǎo kěnéng shǐ rènwù nányǐ wánchéng, huò ràng értóng gǎndào cuòzhé.&quot;], &quot;D&quot;: [&quot;Graduated support allows the child to practise skills while developing independence.&quot;, &quot;逐步调整支持能让儿童练习技能，同时发展独立能力。&quot;, &quot;Zhúbù tiáozhěng zhīchí néng ràng értóng liànxí jìnéng, tóngshí fāzhǎn dúlì nénglì.&quot;]}, &quot;summary&quot;: [&quot;Appropriate, gradually reduced support helps the child build skills and independence.&quot;, &quot;适当且逐步减少的支持，能帮助儿童培养技能和独立能力。&quot;, &quot;Shìdàng qiě zhúbù jiǎnshǎo de zhīchí, néng bāngzhù értóng péiyǎng jìnéng hé dúlì nénglì.&quot;]}];
function tri(lines){return `&lt;div&gt;${esc(lines[0])}&lt;/div&gt;&lt;div class=&quot;zh&quot; lang=&quot;zh-CN&quot;&gt;${esc(lines[1])}&lt;/div&gt;&lt;div class=&quot;py&quot; lang=&quot;zh-Latn&quot;&gt;${esc(lines[2])}&lt;/div&gt;`}
function render(){form.innerHTML=questions.map((q,i)=&gt;`&lt;section class=&quot;question&quot; id=&quot;q${i+1}&quot;&gt;&lt;h2&gt;Question ${i+1} / 第 ${i+1} 题 / Dì ${i+1} tí&lt;/h2&gt;${tri(q.stem)}${Object.entries(q.options).map(([letter,lines])=&gt;`&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;q${i}&quot; value=&quot;${letter}&quot;&gt;&lt;span class=&quot;letter&quot;&gt;${letter}.&lt;/span&gt;&lt;span&gt;${tri(lines)}&lt;/span&gt;&lt;/label&gt;`).join(&#x27;&#x27;)}&lt;div class=&quot;feedback&quot; id=&quot;f${i}&quot; hidden&gt;&lt;/div&gt;&lt;/section&gt;`).join(&#x27;&#x27;);result.hidden=true;document.getElementById(&#x27;submit&#x27;).disabled=false}
document.getElementById(&#x27;submit&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{const answers=questions.map((q,i)=&gt;form.querySelector(`input[name=&quot;q${i}&quot;]:checked`)?.value||null);const missing=answers.findIndex(a=&gt;!a);if(missing&gt;=0){alert(`Please answer Question ${missing+1} before submitting. / 请先回答第 ${missing+1} 题。 / Qǐng xiān huídá dì ${missing+1} tí.`);document.getElementById(`q${missing+1}`).scrollIntoView({behavior:&#x27;smooth&#x27;});return}let score=0;answers.forEach((answer,i)=&gt;{const ok=answer===keys[i];if(ok)score++;const fb=document.getElementById(`f${i}`);fb.hidden=false;fb.innerHTML=`&lt;strong class=&quot;${ok?&#x27;correct&#x27;:&#x27;incorrect&#x27;}&quot;&gt;${ok?&#x27;Correct / 正确 / Zhèngquè&#x27;:&#x27;Not correct / 不正确 / Bù zhèngquè&#x27;}&lt;/strong&gt;&lt;div&gt;Your answer / 你的答案 / Nǐ de dá’àn: ${answer}&lt;/div&gt;&lt;div&gt;Correct answer / 正确答案 / Zhèngquè dá’àn: ${keys[i]}&lt;/div&gt;&lt;div class=&quot;explain&quot;&gt;&lt;strong&gt;Explanation / 解释 / Jiěshì&lt;/strong&gt;&lt;div&gt;${tri(explanations[i].summary)}&lt;/div&gt;&lt;strong&gt;Why each option is correct or incorrect / 各选项的解释 / Gè xuǎnxiàng de jiěshì&lt;/strong&gt;${Object.entries(explanations[i].options).map(([letter,why])=&gt;`&lt;div class=&quot;option-explanation&quot;&gt;&lt;strong&gt;Option ${letter} / 选项 ${letter} / Xuǎnxiàng ${letter}${letter===keys[i]?&quot; ✓&quot;:&quot;&quot;}&lt;/strong&gt;${tri(why)}&lt;/div&gt;`).join(&quot;&quot;)}&lt;/div&gt;`});result.hidden=false;result.innerHTML=`&lt;h2&gt;Score / 分数 / Fēnshù: ${score} / 10&lt;/h2&gt;&lt;p&gt;${score===10?&#x27;All answers are correct. / 全部答对。 / Quánbù dá duì.&#x27;:&#x27;Review the feedback under each question, then try again. / 请查看每题反馈，然后再试一次。 / Qǐng chákàn měi tí fǎnkuì, ránhòu zài shì yí cì.&#x27;}&lt;/p&gt;`;document.getElementById(&#x27;submit&#x27;).disabled=true;result.scrollIntoView({behavior:&#x27;smooth&#x27;})});
document.getElementById(&#x27;reset&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{form.reset();render();window.scrollTo({top:0,behavior:&#x27;smooth&#x27;})});render();
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;" loading="eager" scrolling="no"></iframe></section>

<script>
function switchTab(tab){
 const lecture=tab==='lecture';
 document.getElementById('lecturePanel').hidden=!lecture;
 document.getElementById('quizPanel').hidden=lecture;
 document.getElementById('lectureTab').setAttribute('aria-selected',String(lecture));
 document.getElementById('quizTab').setAttribute('aria-selected',String(!lecture));
 if(!lecture){try{document.getElementById('lectureFrame').contentWindow.stopReading()}catch(e){}}
 window.scrollTo({top:0,behavior:'instant'});
}
function fitFrame(frame){
 try{
  const doc=frame.contentDocument;
  if(!doc||!doc.body)return;
  function update(){const height=Math.max(doc.body.scrollHeight,doc.documentElement.scrollHeight);frame.style.height=(height+16)+'px'}
  update();new ResizeObserver(update).observe(doc.body);
  new MutationObserver(update).observe(doc.body,{subtree:true,childList:true,attributes:true});
  window.addEventListener('resize',update);
 }catch(e){frame.style.height='1500px';frame.setAttribute('scrolling','auto')}
}
for(const id of ['lectureFrame','quizFrame']){
 const f=document.getElementById(id);
 f.addEventListener('load',()=>fitFrame(f));
 if(f.contentDocument&&f.contentDocument.readyState==='complete')fitFrame(f);
}
</script></body></html>
